<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHSCC Check-In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      color: #222;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    header p {
      font-size: 0.9rem;
      color: #666;
      margin-top: 4px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      padding: 24px;
      width: 100%;
      max-width: 440px;
    }

    .card + .card { margin-top: 20px; }

    h2 { font-size: 1.1rem; margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="search"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color .15s;
    }

    input[type="text"]:focus,
    input[type="search"]:focus { border-color: #c9a84c; }

    /* Undo Safari's native search-field chrome so it looks like a text input */
    input[type="search"] { -webkit-appearance: none; appearance: none; }
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { display: none; }

    input.code-input {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: .25em;
      padding: 14px 12px;
    }

    .typeahead { position: relative; }

    .suggest {
      position: absolute;
      left: 0; right: 0; top: 100%;
      background: #fff;
      border: 1.5px solid #c9a84c;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 6px 14px rgba(0,0,0,.12);
    }

    .suggest div {
      padding: 12px;
      font-size: 1rem;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }

    .suggest div:last-child { border-bottom: none; }
    .suggest div:hover, .suggest div.active { background: #faf6e8; }

    .toggle {
      display: flex;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 16px;
    }

    .toggle input { display: none; }

    .toggle label {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin: 0;
      transition: background .15s, color .15s;
    }

    .toggle input:checked + label {
      background: #c9a84c;
      color: #1a1a1a;
      border-color: #c9a84c;
    }

    button[type="submit"] {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      background: #c9a84c;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
    }

    button[type="submit"]:hover:not(:disabled) { background: #b8943d; }
    button[type="submit"]:disabled { background: #aaa; cursor: default; }

    .message {
      text-align: center;
      padding: 32px 16px;
      font-size: 1rem;
      color: #555;
    }

    .message.error { color: #b8400a; }

    .roster-list {
      list-style: none;
      font-size: 0.9rem;
    }

    .roster-list li {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .roster-list li:last-child { border-bottom: none; }

    .roster-list .source {
      color: #888;
      font-size: 0.8rem;
      white-space: nowrap;
      margin-left: 12px;
    }

    .roster-empty { color: #aaa; font-size: 0.9rem; font-style: italic; }

    #status-msg {
      font-size: 0.82rem;
      margin-top: 10px;
      min-height: 1.2em;
      text-align: center;
    }

    #status-msg.ok  { color: #2a7a2a; }
    #status-msg.err { color: #b8400a; }
  </style>
</head>
<body>

<header>
  <h1>NHSCC</h1>
  <p id="meeting-name">Loading…</p>
</header>

<div id="main"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxHtqAqLn8EBH3w1cTkbeSkPOTEwA_aE1o7y9GDuum6pNGFzCLb70o1UeLo16OAOBCXxg/exec';
const POLL_MS = 12000;

const params = new URLSearchParams(location.search);
let   token  = params.get('m');
const main   = document.getElementById('main');
const nameEl = document.getElementById('meeting-name');

let pollTimer = null;
let roster    = [];   // last-known check-ins, for optimistic updates
let members   = [];   // [{ i, name, q }] for the name typeahead
let selectedMember = null; // the member the user picked from the list, if any

// ── Entry point ───────────────────────────────────────────────────────────────

if (!token) {
  renderCodeEntry();
} else {
  // Show the form immediately so people can start typing during the ~1.7s
  // Apps Script round-trip. loadRoster() corrects this if the meeting is
  // actually closed or the token is invalid.
  renderForm('open');
  loadRoster();
  loadMembers();
}

// ── Member directory (for the name typeahead) ─────────────────────────────────

async function loadMembers() {
  try {
    const res  = await fetch(`${API}?action=members&token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (data.ok && Array.isArray(data.members)) members = data.members;
  } catch (_) {
    // No directory? The name field still works as a plain text box.
  }
}

function normName(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function wireTypeahead() {
  const input = document.getElementById('who-input');
  const box   = document.getElementById('suggest');
  if (!input || !box) return;

  let active = -1; // index of the keyboard-highlighted suggestion, -1 = none

  const close = () => {
    box.hidden = true;
    box.innerHTML = '';
    active = -1;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  };

  const pick = item => {
    const m = members.find(x => x.i === Number(item.dataset.i));
    if (m) { input.value = m.name; selectedMember = m; }
    close();
  };

  const setActive = n => {
    const items = box.querySelectorAll('div[data-i]');
    if (!items.length) return;
    active = (n + items.length) % items.length; // wraps top↔bottom
    items.forEach((el, i) => el.classList.toggle('active', i === active));
    items[active].scrollIntoView({ block: 'nearest' });
    input.setAttribute('aria-activedescendant', items[active].id);
  };

  input.addEventListener('input', () => {
    selectedMember = null; // they're editing — drop any prior pick
    const q = normName(input.value);
    if (members.length === 0 || q.length < 2) { close(); return; }
    const matches = members.filter(m => m.q.includes(q)).slice(0, 8);
    if (matches.length === 0) { close(); return; }
    box.innerHTML = matches.map(m => `<div role="option" id="sug-${m.i}" data-i="${m.i}">${esc(m.name)}</div>`).join('');
    box.hidden = false;
    active = -1;
    input.removeAttribute('aria-activedescendant');
    input.setAttribute('aria-expanded', 'true');
  });

  input.addEventListener('keydown', e => {
    if (box.hidden) return;
    if (e.key === 'ArrowDown')    { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Escape')  { close(); }
    else if (e.key === 'Enter' && active >= 0) {
      // Consume the Enter entirely: stopImmediatePropagation keeps the
      // submit-on-Enter listener (registered after this one) from firing
      // with the not-yet-picked text.
      e.preventDefault();
      e.stopImmediatePropagation();
      pick(box.querySelectorAll('div[data-i]')[active]);
    }
  });

  // mousedown fires before the input's blur, so the pick still registers.
  box.addEventListener('mousedown', e => {
    const item = e.target.closest('div[data-i]');
    if (!item) return;
    e.preventDefault();
    pick(item);
  });

  input.addEventListener('blur', () => setTimeout(close, 150));
}

// ── Backup code entry (no token in URL) ───────────────────────────────────────

function renderCodeEntry() {
  nameEl.textContent = 'Enter your meeting code';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Join a meeting</h2>
    <label for="code-input">4-digit meeting code</label>
    <input type="text" id="code-input" class="code-input" inputmode="numeric"
           autocomplete="off" autocorrect="off" maxlength="4" placeholder="0000">
    <button type="submit" id="code-btn">Continue</button>
    <p id="status-msg"></p>
    <p class="roster-empty" style="text-align:center;margin-top:10px">
      The code is shown on screen and read aloud at the meeting.
    </p>
  `;
  main.appendChild(card);

  const input = document.getElementById('code-input');
  document.getElementById('code-btn').addEventListener('click', resolveCode);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') resolveCode(); });
  // Strip anything non-numeric as they type — keeps it forgiving.
  input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, ''); });
  input.focus();
}

async function resolveCode() {
  const input     = document.getElementById('code-input');
  const statusMsg = document.getElementById('status-msg');
  const btn       = document.getElementById('code-btn');
  const code      = input.value.replace(/\D/g, '');

  if (code.length !== 4) {
    statusMsg.className = 'err';
    statusMsg.textContent = 'Enter the 4-digit code.';
    input.focus();
    return;
  }

  btn.disabled = true;
  statusMsg.className = '';
  statusMsg.textContent = 'Looking up meeting…';

  try {
    const res  = await fetch(`${API}?action=resolve&code=${encodeURIComponent(code)}`);
    const data = await res.json();
    if (data.ok && data.token) {
      // Transition into the check-in flow in-page (no full reload). Update the
      // URL so a refresh / bookmark keeps working, then paint the form instantly.
      token = data.token;
      history.replaceState(null, '', '?m=' + encodeURIComponent(token));
      nameEl.textContent = 'Loading…';
      main.innerHTML = '';
      renderForm('open');
      loadRoster();
      loadMembers();
    } else {
      statusMsg.className = 'err';
      statusMsg.textContent = data.error || 'No meeting found for that code.';
      btn.disabled = false;
    }
  } catch (e) {
    statusMsg.className = 'err';
    statusMsg.textContent = 'Could not reach the server. Try again.';
    btn.disabled = false;
  }
}

// ── Roster fetch + render ─────────────────────────────────────────────────────

async function loadRoster() {
  try {
    const res  = await fetch(`${API}?token=${encodeURIComponent(token)}`);
    const data = await res.json();

    if (!data.ok) {
      handleApiError(data.error);
      return;
    }

    nameEl.textContent = data.meetingName;
    document.title     = `NHSCC — ${data.meetingName}`;

    renderForm(data.status);
    renderRoster(data.checkins);

    if (data.status === 'open') schedulePoll();

  } catch (e) {
    showError('Could not reach the check-in server. Check your connection.');
  }
}

function schedulePoll() {
  clearTimeout(pollTimer);
  if (document.hidden) return; // pause while tab is backgrounded — saves Apps Script quota
  pollTimer = setTimeout(pollOnce, POLL_MS);
}

async function pollOnce() {
  try {
    const res  = await fetch(`${API}?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (data.ok) {
      renderRoster(data.checkins);
      if (data.status !== 'open') {
        renderForm('closed');
        return; // stop polling — meeting is over
      }
    }
  } catch (_) {
    // network blip — keep trying
  }
  schedulePoll();
}

// Resume polling immediately when the user returns to the tab.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.getElementById('roster-card')) {
    clearTimeout(pollTimer);
    loadRoster();
  }
});

// ── Render helpers ────────────────────────────────────────────────────────────

function renderForm(status) {
  const existing = document.getElementById('form-card');

  if (status !== 'open') {
    // Replace any optimistically-shown form with the closed notice.
    const card = existing || document.createElement('div');
    card.className = 'card';
    card.id = 'form-card';
    card.innerHTML = `<p class="message">This meeting is closed. No further check-ins are accepted.</p>`;
    if (!existing) main.prepend(card);
    return;
  }

  if (existing) return; // form already shown

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'form-card';
  card.innerHTML = `
    <h2>Check In</h2>
    <label for="who-input">Who's checking in?</label>
    <div class="typeahead">
      <!-- type="search" + no "name"/contact words in id/label/placeholder keeps
           Safari from overlaying its Contacts AutoFill panel on the typeahead -->
      <input type="search" id="who-input" placeholder="Start typing…" enterkeyhint="go"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"
             autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false">
      <div id="suggest" class="suggest" role="listbox" hidden></div>
    </div>
    <div class="toggle">
      <input type="radio" name="source" id="src-person" value="In person" checked>
      <label for="src-person">In person</label>
      <input type="radio" name="source" id="src-zoom" value="Zoom">
      <label for="src-zoom">Zoom</label>
    </div>
    <button type="submit" id="submit-btn">Check In</button>
    <p id="status-msg"></p>
  `;
  main.prepend(card);

  wireTypeahead();
  document.getElementById('submit-btn').addEventListener('click', submitCheckin);
  document.getElementById('who-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitCheckin();
  });

  // Pre-fill name from last check-in on this device
  const savedName = localStorage.getItem('nhscc-name');
  if (savedName) document.getElementById('who-input').value = savedName;
}

function renderRoster(checkins) {
  roster = checkins || roster; // remember the latest for optimistic updates
  checkins = roster;
  let card = document.getElementById('roster-card');
  if (!card) {
    card = document.createElement('div');
    card.className = 'card';
    card.id = 'roster-card';
    main.appendChild(card);
  }

  if (!checkins || checkins.length === 0) {
    card.innerHTML = `<h2>Who's checked in</h2><p class="roster-empty">No one yet — be the first!</p>`;
    return;
  }

  // Newest first so the person who just checked in sees themselves at the top.
  const items = checkins.slice().reverse().map(c =>
    `<li><span>${esc(c.name)}</span><span class="source">${esc(c.source)}</span></li>`
  ).join('');

  card.innerHTML = `<h2>Who's checked in (${checkins.length})</h2><ul class="roster-list">${items}</ul>`;
}

function showError(msg) {
  nameEl.textContent = 'NHSCC Check-In';
  main.innerHTML = `<div class="card"><p class="message error">${esc(msg)}</p></div>`;
}

function handleApiError(err) {
  if (/closed/i.test(err))        showError('This meeting is closed.');
  else if (/not opened/i.test(err)) showError('This meeting hasn\'t opened yet.');
  else if (/unknown/i.test(err))  showError('Meeting not found. Make sure you scanned the right QR code.');
  else                            showError(err || 'Something went wrong.');
}

// ── Check-in submit ───────────────────────────────────────────────────────────

async function submitCheckin() {
  const nameInput = document.getElementById('who-input');
  const statusMsg = document.getElementById('status-msg');
  const submitBtn = document.getElementById('submit-btn');
  const source    = document.querySelector('input[name="source"]:checked').value;
  const name      = nameInput.value.trim();

  if (!name) {
    statusMsg.className = 'err';
    statusMsg.textContent = 'Please enter your name.';
    nameInput.focus();
    return;
  }

  submitBtn.disabled   = true;
  statusMsg.className  = '';
  statusMsg.textContent = 'Submitting…';

  try {
    const res  = await fetch(API, {
      method:  'POST',
      // text/plain avoids CORS preflight — Apps Script doesn't handle OPTIONS
      headers: { 'Content-Type': 'text/plain' },
      // memberIndex lets the server grab the exact barcode when a name was picked
      // from the list; the server also falls back to name matching if it's absent.
      body:    JSON.stringify({ token, name, source, memberIndex: selectedMember ? selectedMember.i : null }),
    });
    const data = await res.json();

    if (data.ok) {
      statusMsg.className  = 'ok';
      statusMsg.textContent = data.alreadyCheckedIn
        ? `You're already checked in — all set.`
        : `Checked in as "${name}".`;
      localStorage.setItem('nhscc-name', name);
      nameInput.value = '';
      if (!data.alreadyCheckedIn) {
        // Show the new entry instantly; the next poll reconciles with the server.
        roster = roster.concat([{ name, source, timestamp: new Date().toISOString() }]);
        renderRoster(roster);
      }
    } else {
      statusMsg.className  = 'err';
      statusMsg.textContent = data.error || 'Check-in failed. Try again.';
      submitBtn.disabled = false;
    }
  } catch (e) {
    statusMsg.className  = 'err';
    statusMsg.textContent = 'Network error. Try again.';
    submitBtn.disabled = false;
  }
}

// ── Utility ───────────────────────────────────────────────────────────────────

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
</script>

</body>
</html>
